[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entr0py"
version = "0.1.0"
description = "Modular, extensible penetration testing framework"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "aiofiles>=23.2.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "pyfiglet>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.7",
    "ruff>=0.1",
]

[project.scripts]
entr0py = "entr0py.__main__:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["entr0py*"]

[tool.setuptools.package-data]
entr0py = ["playbooks/*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
